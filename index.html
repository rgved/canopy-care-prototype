<div class="layout"><aside class="sidebar"><div class="brand"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 35V17M20 25C5 25 6 7 6 7s15 0 14 18ZM20 20C20 5 35 5 35 5s1 15-15 15Z" stroke="#365c45" stroke-width="2.5" stroke-linejoin="round"/></svg>canopy</div><div class="tagline">Room for recovery</div><nav class="nav" id="nav" aria-label="Main navigation"></nav><div class="sidebar-bottom"><div class="notice success" style="font-size:11px">A little clarity.<br>A better day of care.</div><div class="facility"><strong>Canopy Care Centre</strong><br><span class="muted">74-patient capacity · IST</span><br><span class="tiny">Functional prototype v1.0</span></div></div></aside><main class="main"><header class="topbar"><div class="date" id="date"></div><div class="role"><div class="avatar" id="avatar">AN</div><select id="role" aria-label="Demo role"><option value="nurse">Asha · Nurse</option><option value="doctor">Dr. Meera · Doctor</option><option value="admin">Rohan · Admin</option><option value="head">Dr. Iyer · Head doctor</option></select></div></header><div class="content"><div class="demo"><span>DEMO WORKSPACE · Fictional patients only. Data stays in this browser. Role switcher is not authentication.</span><button id="guide">Demo guide ↗</button></div><div id="view"></div></div></main></div><dialog id="modal" aria-labelledby="modal-title"></dialog><div id="toast" role="status" hidden></div>
<script>
'use strict';
const KEY='canopy-prototype-v1';const users={nurse:'Nurse Asha',doctor:'Dr. Meera',admin:'Rohan (Admin)',head:'Dr. Iyer'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayFormatter=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'});const day=(d=new Date())=>dayFormatter.format(d);
const shift=(s,n)=>{let d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const stamp=(offset=0)=>shift(day(),offset)+'T04:00:00Z';
const time=s=>new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit'}).format(new Date(s));
function streak(p,settings=S.settings){let n=0;for(let i=1;i<=3;i++){const readings=p.readings.filter(r=>!r.voided&&day(new Date(r.at))===shift(day(),-i));if(!readings.length||readings.some(r=>r.value>=settings.threshold))break;n++}return n}
const todays=p=>p.readings.filter(r=>!r.voided&&day(new Date(r.at))===day());
const visited=p=>p.visits.some(v=>day(new Date(v.at))===day());
const eligible=p=>!p.closed&&streak(p)>=3&&!todays(p).some(r=>r.value>=S.settings.threshold);
const status=p=>!todays(p).length?'needs':!visited(p)?'ready':'done';
const active=()=>S.patients.filter(p=>!p.closed);
function seed(){const first=['Anaya','Vihaan','Ishita','Arjun','Diya','Kabir','Riya','Aarav','Sana','Dev','Mira','Neil','Tara','Rohan','Zoya','Aditya'];const last=['Shah','Patil','Rao','Mehta','Nair','Desai','Joshi','Singh','Kapoor','Sen'];let patients=Array.from({length:74},(_,i)=>{let p={id:'P'+String(i+1).padStart(3,'0'),name:first[i%16]+' '+last[(i*3)%10],age:20+(i*7)%57,slot:i+1,admitted:stamp(-7-i%6),readings:[],visits:[],approved:null};for(let d=-6;d<=0;d++){if(d===0&&i%3===0||d===-2&&i%9===8)continue;let value=i<8?36.6+(i%4)*.2:((i+d+20)%5===0?38.2+(i%6)*.2:36.7+(i%5)*.2);p.readings.push({id:crypto.randomUUID(),value,at:stamp(d),by:'Nurse Asha',reason:''})}if(i%3===1)p.visits.push({at:stamp(),by:'Dr. Meera',notes:'Routine review completed. Continue observation.'});return p});for(let i=0;i<40;i++)patients.push({id:'H'+i,name:'Sample closed case '+(i+1),age:35,slot:null,admitted:stamp(-20),readings:[],visits:[],closed:stamp(-1-i%20),outcome:i<5?'deceased':'recovered'});return{version:1,patients,settings:{threshold:38,tempDeadline:'11:00',visitDeadline:'17:00'},audit:[]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY));if(!S||S.version!==1)S=seed()}catch{S=seed()};let role='nurse',page='rounds',filter='all',query='';let saveFailed=false;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));saveFailed=false;return true}catch{saveFailed=true;toast('Browser storage failed. Changes are only in memory; do not close this tab.');return false}}
function audit(action,p,details=''){S.audit.unshift({at:new Date().toISOString(),by:users[role],action,patient:p?.id||'Workspace',details});persist()}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,4800)}
function can(...roles){return roles.includes(role)}
const navs={nurse:[['rounds','◉','Daily rounds'],['audit','≡','Activity log']],doctor:[['ward','▤','Ward board'],['discharges','↗','Discharges'],['audit','≡','Activity log']],admin:[['discharges','↗','Discharges'],['capacity','▦','Capacity & admissions'],['audit','≡','Activity log']],head:[['ward','▤','Ward board'],['discharges','↗','Discharges'],['insights','◔','Care insights'],['settings','⚙','Demo settings'],['audit','≡','Activity log']]};
function art(){return '<svg class="heading-art" viewBox="0 0 160 110" fill="none" aria-hidden="true"><ellipse cx="85" cy="101" rx="52" ry="5" fill="#e6e9da"/><path d="M85 96V36M85 67C53 69 45 44 46 32c24-2 38 15 39 35ZM85 50C85 22 109 14 127 16c1 21-18 37-42 34Z" stroke="#809b6a" stroke-width="2" fill="#e1e9d5"/><path d="M85 88C105 69 121 76 124 77c-3 17-23 22-39 11Z" fill="#b6c69e"/><path d="M69 89h33l-5 16H74Z" fill="#d8b596"/><circle cx="31" cy="25" r="9" fill="#ece2b9"/><path d="M135 68v10m-5-5h10" stroke="#a6b48b" stroke-width="2"/></svg>'}
function heading(k,title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${action||art()}</div>`}
function stats(){const ps=active(),measured=ps.filter(p=>todays(p).length).length,visits=ps.filter(visited).length,ready=ps.filter(eligible).length;return `<div class="stats">${[[ps.length+'/74','Patients in care','▦',ps.length/74],[measured,'Temperatures recorded','♧',measured/(ps.length||1)],[visits,'Doctor visits complete','✓',visits/(ps.length||1)],[ready,'Eligible for review','↗',ready/(ps.length||1)]].map(([n,l,i,v])=>`<div class="stat"><div class="stat-label">${l}</div><span class="stat-icon">${i}</span><div class="stat-number">${n}</div><div class="quiet">${l==='Eligible for review'?'3 completed fever-free days':l==='Patients in care'?(74-ps.length)+' places available':'Today · resets at midnight IST'}</div><div class="progress"><i style="width:${v*100}%"></i></div></div>`).join('')}</div>`}
function badge(p){const t=todays(p),s=status(p);const now=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());if(!t.length)return `<span class="badge ${now>=S.settings.tempDeadline?'clay':'blue'}">◷ ${now>=S.settings.tempDeadline?'Temperature overdue':'Needs temperature'}</span>`;if(t.some(r=>r.value>=S.settings.threshold))return '<span class="badge clay">♨ Fever recorded</span>';return s==='ready'?`<span class="badge amber">◷ ${now>=S.settings.visitDeadline?'Visit overdue':'Ready for doctor'}</span>`:'<span class="badge">✓ Done today</span>'}
function growth(p){const n=streak(p);return `<div class="dots" aria-hidden="true">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div><span class="quiet">${n} / 3 full days${todays(p).some(r=>r.value>=S.settings.threshold)?' · Fever today':''}</span>`}
function person(p){return `<div class="patient"><span class="initials">${esc(p.name.split(' ').map(x=>x[0]).join(''))}</span><div><strong>${esc(p.name)}</strong><span class="quiet">${p.id} · ${p.age} years · Fictional</span></div></div>`}
function render(){document.getElementById('nav').innerHTML=navs[role].map(([id,icon,title])=>`<button data-nav="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span aria-hidden="true">${icon}</span>${title}</button>`).join('');document.getElementById('avatar').textContent={nurse:'AN',doctor:'MD',admin:'RA',head:'HI'}[role];document.getElementById('date').textContent=new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())+' · IST';const v=document.getElementById('view');v.innerHTML=page==='rounds'?rounds():page==='ward'?ward():page==='discharges'?discharges():page==='capacity'?capacity():page==='insights'?insights():page==='settings'?settings():activity();bindView()}
function rounds(){let ps=active().filter(p=>(filter==='all'||filter==='needs'&&!todays(p).length||filter==='done'&&todays(p).length)&&p.name.toLowerCase().includes(query.toLowerCase()));return heading('Nurse workspace','A clearer day of care.',"Every check counts. Let's make sure no one is missed.")+stats()+`<section class="panel"><div class="panel-head"><h3>Today's rounds <span class="muted">/ ${active().length} patients</span></h3><span class="quiet">● Saved on this device</span></div><div class="toolbar"><div class="filters">${[['all','All patients'],['needs','Needs temperature'],['done','Measured']].map(([f,l])=>`<button data-filter="${f}" class="${filter===f?'active':''}">${l}</button>`).join('')}</div><input class="search" id="search" aria-label="Search patients" placeholder="Search patient name..." value="${esc(query)}"></div><div class="tablewrap"><table><thead><tr><th>Patient</th><th>Care location</th><th>Today's status</th><th>Latest reading</th><th>Fever-free progress</th><th></th></tr></thead><tbody>${ps.map(p=>{let t=todays(p).at(-1);return `<tr><td>${person(p)}</td><td><strong>Place ${String(p.slot).padStart(2,'0')}</strong><div class="quiet">Zone ${String.fromCharCode(65+Math.floor((p.slot-1)/15))}</div></td><td>${badge(p)}</td><td>${t?`<strong>${t.value.toFixed(1)} °C</strong><div class="quiet">${esc(t.by)} · ${time(t.at)}</div>`:'<span class="muted">Not recorded</span>'}</td><td>${growth(p)}</td><td><button class="${t?'secondary ':''}small" data-patient="${p.id}">${t?'View / re-check':'Record temp'} ↗</button></td></tr>`}).join('')}</tbody></table>${!ps.length?'<div class="empty">No patients match this view.</div>':''}</div><div class="table-footer"><span>${ps.length} patients shown · All sample data</span><span>One routine check. Re-checks when needed.</span></div></section>`}
function ward(){const ps=active().filter(p=>p.name.toLowerCase().includes(query.toLowerCase()));return heading('Doctor workspace','Care, in the right order.','Review temperatures, complete visits and keep recovery moving.')+stats()+`<div style="margin-bottom:18px"><input class="search" id="search" aria-label="Search patients" placeholder="Search patient name..." value="${esc(query)}"></div><div class="cards">${[['ready','Ready for visit'],['needs','Waiting for temperature'],['done','Visited today']].map(([s,title])=>{let list=ps.filter(p=>status(p)===s).sort((a,b)=>(todays(b).at(-1)?.value||0)-(todays(a).at(-1)?.value||0));return `<section class="ward-col"><h3>${title} <span class="muted">(${list.length})</span></h3>${list.map(p=>`<article class="patient-card"><div class="flex"><span class="quiet">PLACE ${String(p.slot).padStart(2,'0')}</span>${eligible(p)?'<span class="badge">↗ Review discharge</span>':''}</div>${person(p)}<div class="flex"><span class="temp">${todays(p).at(-1)?.value.toFixed(1)||'--'}<small style="font-size:12px"> °C</small></span><div>${growth(p)}</div></div><div style="margin-top:10px">${badge(p)}</div><button class="secondary small" data-patient="${p.id}">Open patient →</button></article>`).join('')||'<div class="empty">No patients in this group.</div>'}</section>`}).join('')}</div>`}
function discharges(){let ps=active().filter(p=>eligible(p)||p.approved);return heading('Recovery workflow','Ready for the next chapter.','System flags eligibility. Doctor reviews. Admin records departure.')+`<div class="notice success">Demo interpretation: 3 completed calendar days in IST, all recorded readings below the demo fever threshold. Today is never counted as a full day. This interpretation and threshold require clinical approval before real use.</div><section class="panel"><div class="panel-head"><h3>Discharge review queue</h3><span class="badge">${ps.length} patients</span></div>${ps.map(p=>`<div class="pad" style="border-bottom:1px solid var(--line)"><div class="flex">${person(p)}<span class="badge ${eligible(p)?'':'clay'}">${eligible(p)?'✓ 3 full days evidenced':'! Eligibility changed'}</span></div><div class="statusline">Place ${p.slot} · ${p.approved?'Approved by '+esc(p.approved.by)+' at '+time(p.approved.at):'Waiting for doctor review'}</div><button data-patient="${p.id}" class="${p.approved?'':'secondary'}">${can('admin')?(p.approved?'Review & complete discharge':'View pending review'):'Review patient'} →</button></div>`).join('')||'<div class="empty">No patients awaiting discharge.<br>Newly eligible patients will appear here automatically.</div>'}</section>`}
function capacity(){return heading('Admin workspace','Make room for better care.','Capacity is 74 patients. Locations below are demo allocation slots, not rooms.',`<button id="admit" ${active().length>=74?'disabled':''}>+ Admit patient</button>`)+stats()+(active().length>=74?'<div class="notice">Full capacity: 74 of 74 places occupied. Complete a confirmed discharge before admitting another patient.</div>':'')+`<section class="panel"><div class="panel-head"><h3>Care locations</h3><div class="legend"><span>● Occupied</span><span>○ Available</span></div></div><div class="slots">${Array.from({length:74},(_,i)=>{const p=active().find(p=>p.slot===i+1);return `<button class="slot ${!p?'free':todays(p).some(r=>r.value>=S.settings.threshold)?'hot':''}" ${p?`data-patient="${p.id}"`:`data-slot="${i+1}"`} aria-label="Place ${i+1}, ${p?esc(p.name):'available'}">${p?'♧':'+'} ${String(i+1).padStart(2,'0')}<small>${p?'Occupied':'Available'}</small></button>`}).join('')}</div></section>`}
function insights(){const cutoff=Date.now()-30*864e5,closed=S.patients.filter(p=>p.closed&&new Date(p.closed).getTime()>=cutoff),deaths=closed.filter(p=>p.outcome==='deceased').length,rec=closed.length-deaths,rate=closed.length?deaths/closed.length*100:0;return heading('Head doctor workspace','A view of the bigger picture.','Outcomes help us ask better questions about the care we provide.')+`<div class="grid2"><section class="panel pad"><div class="eyebrow">Treatment outcomes · Last 30 days</div><h2>Mortality against benchmark</h2><div class="ring"><span class="big">${closed.length?rate.toFixed(1)+'%':'--'}</span><span class="quiet">Facility mortality</span></div><p style="text-align:center" class="muted">${deaths} deceased / ${closed.length} closed cases<br>Virus benchmark: 15%</p><div class="notice ${rate<=15?'success':''}">${!closed.length?'No resolved outcomes yet.':rate>15?'Above the supplied 15% benchmark. Review the closed-case cohort and care process.':'Within the supplied benchmark for this sample.'} ${closed.length>0&&closed.length<20?'Small sample: fewer than 20 closed cases. Interpret with caution. ':''}This is a descriptive comparison, not a risk-adjusted clinical conclusion.</div></section><div class="stack"><section class="panel pad"><div class="eyebrow">Recovery rate</div><div class="big">${closed.length?(100-rate).toFixed(1)+'%':'--'}</div><p class="muted">${rec} recovered discharges · ${closed.length} closed cases<br>Benchmark: 85% success</p></section><section class="panel pad"><h3>How this is calculated</h3><p class="note">Mortality = deceased ÷ (deceased + recovered discharges). Only admissions closed in the last rolling 30 days are included. Active patients are excluded.</p><p class="note">The initial cohort contains 40 fictional outcomes. Newly completed outcomes update these numbers immediately.</p><span class="badge">${active().length} active patients excluded</span></section></div></div>`}
function settings(){return heading('Head doctor workspace','Clear rules. Visible assumptions.','Demo settings are not clinical advice or approved treatment policy.')+`<section class="panel pad"><h2>Clinical demo configuration</h2><div class="notice">For demonstration only: fever is ≥ 38.0 °C by default. The original brief does not define a fever threshold or whether full days mean calendar days or 72 hours. A clinician must confirm these before any real use.</div><form id="settings-form"><div class="settings-row"><label for="threshold">Fever threshold (°C)<div class="quiet">A change recomputes all eligibility and invalidates approvals.</div></label><input id="threshold" name="threshold" type="number" step="0.1" required min="1" max="100" value="${S.settings.threshold}"></div><div class="settings-row"><label for="tempDeadline">Temperature due (IST)</label><input id="tempDeadline" name="tempDeadline" type="time" required value="${S.settings.tempDeadline}"></div><div class="settings-row"><label for="visitDeadline">Doctor visit due (IST)</label><input id="visitDeadline" name="visitDeadline" type="time" required value="${S.settings.visitDeadline}"></div><div class="settings-row"><span>Fever-free rule</span><strong>3 completed days</strong></div><p class="note" style="margin-top:18px">Each of the previous 3 calendar days must have at least one valid reading and no fever. Missing readings mean insufficient evidence. A fever today blocks discharge too. Facility timezone: Asia/Kolkata.</p><button>Save demo settings</button></form></section><section class="panel pad" style="margin-top:20px"><h3>Reset the demonstration</h3><p class="note">Replace this device's records with the original fictional cohort. This cannot restore your current local edits.</p><button id="reset" class="secondary">Reset demo data</button></section>`}
function activity(){return heading('Workspace history','Every action leaves a trace.','Append-only demo activity, saved on this browser. Not a production audit system.')+`<section class="panel"><div class="panel-head"><h3>Activity log</h3><span class="quiet">${S.audit.length} events</span></div>${S.audit.map(a=>`<div class="audit-row"><div class="flex"><strong>${esc(a.action)}</strong><time>${esc(new Date(a.at).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}))} IST</time></div><div>${esc(a.patient)} · ${esc(a.by)} · ${esc(a.details)}</div></div>`).join('')||'<div class="empty">Your team\'s demo actions will appear here.<br>Record a temperature to get started.</div>'}</section>`}
function show(title,body){const m=document.getElementById('modal');m.innerHTML=`<div class="modalhead"><h2 id="modal-title">${title}</h2><button class="close" aria-label="Close dialog">×</button></div><div class="modalbody">${body}</div>`;m.querySelector('.close').onclick=()=>m.close();if(!m.open)m.showModal()}
function chart(p){const rs=p.readings.filter(r=>!r.voided).slice(-14);if(!rs.length)return '<div class="empty">No readings yet.</div>';let min=Math.min(36,...rs.map(r=>r.value)),max=Math.max(39,...rs.map(r=>r.value));let pts=rs.map((r,i)=>`${30+i*540/Math.max(1,rs.length-1)},${105-(r.value-min)/(max-min)*85}`).join(' ');return `<svg class="history" viewBox="0 0 600 125" role="img" aria-label="Recent temperature trend from ${rs[0].value} to ${rs.at(-1).value} degrees Celsius"><line x1="30" x2="570" y1="${105-(S.settings.threshold-min)/(max-min)*85}" y2="${105-(S.settings.threshold-min)/(max-min)*85}" stroke="#b58b6d" stroke-dasharray="5 5"/><polyline points="${pts}" stroke="#638154" stroke-width="2.5" fill="none"/>${rs.map((r,i)=>`<circle cx="${30+i*540/Math.max(1,rs.length-1)}" cy="${105-(r.value-min)/(max-min)*85}" r="3" fill="#638154"/>`).join('')}</svg>`}
function openPatient(id){let p=S.patients.find(p=>p.id===id);if(!p)return;const t=todays(p);show(esc(p.name),`<div class="flex"><span class="quiet">${p.id} · Place ${p.slot||'closed'} · ${p.age} years</span>${p.closed?`<span class="badge">${esc(p.outcome)}</span>`:badge(p)}</div>${chart(p)}<div class="flex"><div>${growth(p)}</div><span class="quiet">Demo threshold: ${S.settings.threshold} °C</span></div>${!p.closed&&can('nurse','doctor','head')?`<form id="temp-form"><label for="temperature">${t.length?'Additional temperature (re-check)':'Record temperature'} · °C</label><input class="temp-input" id="temperature" name="temperature" type="number" step="0.1" placeholder="37.0" required aria-label="Temperature in Celsius">${t.length?`<div class="notice">Already measured at ${time(t.at(-1).at)} by ${esc(t.at(-1).by)}. A repeat needs a reason; the earlier record is retained.</div><label for="reason">Re-check reason</label><input id="reason" name="reason" required style="width:100%" placeholder="Reason for another measurement">`:''}<label style="font-weight:400"><input type="checkbox" name="confirm" style="min-height:20px;vertical-align:middle"> I have confirmed the number and °C unit (required for unusual values).</label><div class="error" id="temp-error" role="alert"></div><button style="width:100%;margin-top:10px">Save temperature</button></form>`:''}${!p.closed&&can('doctor','head')?`<hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h3>Doctor review</h3>${!t.length?'<div class="notice">No temperature today. Record it above, or log the actual visit with a missing-temperature reason. Necessary care is never blocked.</div>':''}<form id="visit-form"><label for="notes">Visit notes ${!t.length?'(required when temperature missing)':'(optional)'}</label><textarea id="notes" name="notes" ${!t.length?'required':''} placeholder="Treatment, observation or workflow exception..."></textarea><button class="secondary" style="width:100%;margin-top:10px">${visited(p)?'Log follow-up visit':'Mark visited'}</button></form><div class="actions"><button id="approve" ${!eligible(p)||p.approved?'disabled':''}>${p.approved?'✓ Discharge approved':'Approve discharge'}</button><button class="secondary" id="death">Record death</button></div>${!eligible(p)?'<p class="note" style="margin-top:10px">Discharge requires 3 completed fever-free days, with no fever today.</p>':''}`:''}${!p.closed&&can('admin')?`<div class="notice ${p.approved&&eligible(p)?'success':''}">${p.approved?'Doctor approval: '+esc(p.approved.by):'Waiting for doctor approval. Admin cannot override eligibility.'}</div><button id="discharge" style="width:100%" ${!p.approved||!eligible(p)?'disabled':''}>Complete recovered discharge</button>`:''}<details style="margin-top:25px"><summary style="cursor:pointer;min-height:38px">Daily checklist history (last 7 days)</summary><div class="tablewrap"><table><thead><tr><th>Facility day</th><th>Temperature</th><th>Doctor visit</th></tr></thead><tbody>${Array.from({length:7},(_,i)=>{let d=shift(day(),-i),rs=p.readings.filter(r=>!r.voided&&day(new Date(r.at))===d),vs=p.visits.filter(v=>day(new Date(v.at))===d);return `<tr><td>${d}</td><td>${rs.length?'✓ Recorded':i===0?'Due today':'! Missing record'}</td><td>${vs.length?'✓ Visited':i===0?'Due today':'! Missing record'}</td></tr>`}).join('')}</tbody></table></div></details><details style="margin-top:15px"><summary style="cursor:pointer;min-height:38px">Temperature & visit history (${p.readings.length} readings)</summary><div class="tablewrap"><table><thead><tr><th>Measured (IST)</th><th>Temperature</th><th>Staff / reason</th><th></th></tr></thead><tbody>${[...p.readings].reverse().map(r=>`<tr><td>${day(new Date(r.at))}<br>${time(r.at)}</td><td>${r.value.toFixed(1)} °C${r.voided?' · VOID':''}</td><td>${esc(r.by)}<br>${esc(r.reason)}</td><td>${!p.closed&&!r.voided&&can('head')?`<button class="secondary small" data-void="${r.id}">Void</button>`:''}</td></tr>`).join('')}</tbody></table></div>${p.visits.map(v=>`<p class="note">${day(new Date(v.at))} ${time(v.at)} · ${esc(v.by)}<br>${esc(v.notes)||'Visit recorded'}</p>`).join('')}</details>`);
const tf=document.getElementById('temp-form');if(tf)tf.onsubmit=e=>{e.preventDefault();if(p.closed||!can('nurse','doctor','head'))return;let f=new FormData(tf),value=Number(f.get('temperature')),reason=String(f.get('reason')||'').trim(),error=document.getElementById('temp-error');if(!Number.isFinite(value)){error.textContent='Enter a valid numeric temperature.';return}if((value<34||value>43)&&!f.get('confirm')){error.textContent='Unusual value. Verify the thermometer and unit, then check the confirmation box. Genuine extremes can still be saved.';return}if(todays(p).length&&!reason){error.textContent='A reading now exists today. Reopen this patient and give a re-check reason.';return}p.readings.push({id:crypto.randomUUID(),value,at:new Date().toISOString(),enteredAt:new Date().toISOString(),unit:'C',by:users[role],reason});if(!eligible(p))p.approved=null;audit('Temperature recorded',p,value.toFixed(1)+' °C'+(reason?' · Re-check: '+reason:''));render();openPatient(id);toast(saveFailed?'Reading only in memory. Browser storage failed.':'Temperature saved. Daily status updated.')};
const vf=document.getElementById('visit-form');if(vf)vf.onsubmit=e=>{e.preventDefault();if(!can('doctor','head')||p.closed)return;let notes=String(new FormData(vf).get('notes')).trim();if(!todays(p).length&&!notes)return;p.visits.push({at:new Date().toISOString(),by:users[role],notes});audit('Doctor visit recorded',p,notes);render();openPatient(id);toast('Visit saved. Nurse measurement remains a separate task.')};
const a=document.getElementById('approve');if(a)a.onclick=()=>{if(!can('doctor','head')||!eligible(p))return;p.approved={at:new Date().toISOString(),by:users[role]};audit('Discharge approved',p,'Admin notified in discharge queue');render();openPatient(id);toast('Approved. Patient is now in the admin discharge queue.')};
const d=document.getElementById('discharge');if(d)d.onclick=()=>{if(!can('admin')||!p.approved||!eligible(p))return;confirmAction('Complete discharge?',`${esc(p.name)} will be recorded as recovered and Place ${p.slot} will become available.`,()=>{if(!eligible(p)||!p.approved)return toast('Eligibility changed. Doctor review is required.');const slot=p.slot;p.closed=new Date().toISOString();p.outcome='recovered';p.slot=null;audit('Recovered discharge completed',p,'Freed Place '+slot);document.getElementById('modal').close();render();toast('Discharge complete. Place '+slot+' is now available.')})};
const death=document.getElementById('death');if(death)death.onclick=()=>{show('Record deceased outcome',`<p class="note">Confirm the outcome for ${esc(p.name)}. This closes the admission, frees the allocated place and updates mortality. Records remain in history.</p><form id="death-form"><label for="death-note">Outcome note (required)</label><textarea id="death-note" name="note" required></textarea><label><input type="checkbox" required style="min-height:20px"> I confirm this outcome for ${esc(p.name)}.</label><div class="actions"><button type="button" class="secondary" id="back">Cancel</button><button class="danger">Confirm deceased</button></div></form>`);document.getElementById('back').onclick=()=>openPatient(id);document.getElementById('death-form').onsubmit=e=>{e.preventDefault();if(!can('doctor','head')||p.closed)return;p.closed=new Date().toISOString();p.outcome='deceased';p.outcomeNote=String(new FormData(e.target).get('note')).trim();p.slot=null;audit('Deceased outcome recorded',p,p.outcomeNote);document.getElementById('modal').close();render();toast('Outcome recorded and capacity updated.')}};
document.querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>{if(!can('head'))return;show('Void reading with reason',`<p class="note">The original reading is retained. Eligibility will be recalculated and discharge approval removed.</p><form id="void-form"><label for="void-reason">Correction reason</label><textarea id="void-reason" name="reason" required></textarea><button>Confirm correction</button></form>`);document.getElementById('void-form').onsubmit=e=>{e.preventDefault();let r=p.readings.find(r=>r.id===b.dataset.void);r.voided={at:new Date().toISOString(),reason:String(new FormData(e.target).get('reason')),by:users[role]};p.approved=null;audit('Reading voided',p,r.voided.reason);render();openPatient(id)}})}
function confirmAction(title,text,fn){show(title,`<p>${text}</p><div class="actions"><button class="secondary" id="cancel">Cancel</button><button id="confirm">Confirm</button></div>`);document.getElementById('cancel').onclick=()=>document.getElementById('modal').close();document.getElementById('confirm').onclick=fn}
function admit(slot){if(!can('admin')||active().length>=74)return toast('Admission blocked: capacity is full.');const free=Array.from({length:74},(_,i)=>i+1).filter(i=>!active().some(p=>p.slot===i));show('Welcome a new patient',`<p class="note">Use fictional details only. A new admission starts its own clinical history.</p><form id="admit-form"><label for="name">Fictional patient name</label><input name="name" id="name" required maxlength="80" style="width:100%"><label for="age">Age</label><input name="age" id="age" type="number" required min="0" max="120" value="30"><label for="slot">Available place</label><select name="slot" id="slot">${free.map(i=>`<option ${i===slot?'selected':''} value="${i}">Place ${i}</option>`).join('')}</select><div class="actions"><button>Admit patient</button></div></form>`);document.getElementById('admit-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),slot=Number(f.get('slot')),name=String(f.get('name')).trim();if(!name)return;if(active().length>=74||active().some(p=>p.slot===slot))return toast('Place no longer available. Reopen the admission form.');const p={id:'P-'+crypto.randomUUID().slice(0,8),name,age:Number(f.get('age')),slot,admitted:new Date().toISOString(),readings:[],visits:[],approved:null};S.patients.push(p);audit('Patient admitted',p,'Allocated Place '+slot);document.getElementById('modal').close();render();toast('Patient admitted. Daily checks are now due.')}}
function bindView(){document.querySelectorAll('[data-patient]').forEach(b=>b.onclick=()=>openPatient(b.dataset.patient));document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>admit(Number(b.dataset.slot)));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});const search=document.getElementById('search');if(search)search.oninput=()=>{const pos=search.selectionStart;query=search.value;render();const s=document.getElementById('search');s.focus();s.setSelectionRange(pos,pos)};const ad=document.getElementById('admit');if(ad)ad.onclick=()=>admit();const sf=document.getElementById('settings-form');if(sf)sf.onsubmit=e=>{e.preventDefault();if(!can('head'))return;const f=new FormData(sf);S.settings={threshold:Number(f.get('threshold')),tempDeadline:String(f.get('tempDeadline')),visitDeadline:String(f.get('visitDeadline'))};active().forEach(p=>p.approved=null);audit('Demo settings updated',null,'All discharge approvals invalidated');render();toast('Settings saved. Eligibility recomputed; doctor review required again.')};const reset=document.getElementById('reset');if(reset)reset.onclick=()=>confirmAction('Reset demo data?','All local demo edits will be replaced with the fictional sample cohort.',()=>{S=seed();persist();document.getElementById('modal').close();render();toast('Demo reset to 74 fictional active patients.')})}
document.getElementById('nav').onclick=e=>{const b=e.target.closest('[data-nav]');if(!b)return;page=b.dataset.nav;query='';filter='all';render()};document.getElementById('role').onchange=e=>{role=e.target.value;page=navs[role][0][0];query='';filter='all';document.getElementById('modal').close();render()};
document.getElementById('guide').onclick=()=>show('Take Canopy for a round.',`<div class="eyebrow">5-minute demo walkthrough</div><p><strong>1. Nurse:</strong> Open Daily rounds, filter Needs temperature, and record 37.0 °C for a patient. Open them again to demonstrate a reason-required re-check.</p><p><strong>2. Doctor:</strong> Switch roles at the top right. Find the same patient under Ready for visit, inspect the curve and history, add a note and mark visited.</p><p><strong>3. Discharge:</strong> Open Discharges. Sample patients with three completed fever-free days are waiting for review. Approve one as Doctor, switch to Admin and complete departure.</p><p><strong>4. Admin:</strong> Open Capacity & admissions. The freed place is available. Admit a fictional patient and see daily tasks become due.</p><p><strong>5. Head doctor:</strong> Inspect Care insights, change demo thresholds, review the activity log or reset the sample cohort.</p><div class="notice">Prototype, not a clinical system. Role switching is a demo convenience, not access control. Data uses localStorage and syncs only across tabs on this browser, not across devices. No real patient information should be entered. Production needs approved clinical definitions, authenticated server-side roles, a shared database, backups, concurrency controls and privacy/security review.</div><p class="note">No build step or paid service is required. This app runs as a static index.html on Vercel or any static host. Readings are append-only; head-doctor corrections void with a reason. The 74 allocation places represent patient capacity, not a claim about room count.</p>`);
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{S=JSON.parse(e.newValue);document.getElementById('modal').close();render();toast('Workspace updated from another tab.')}catch{}}});let lastDay=day();setInterval(()=>{const now=day();if(now!==lastDay){lastDay=now;document.getElementById('modal').close();render();toast('A new facility day has started. Daily checks refreshed.')}},30000);persist();render();
</script></body></html>
